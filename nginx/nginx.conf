worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile          on;
    keepalive_timeout 65;
    server_tokens     off;

    # Rate limiting: 10 запросов в секунду на IP клиента.
    # burst=20 сглаживает короткие всплески, всё сверх — 429
    limit_req_zone   $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_req_status 429;

    # Ограничение размера тела запроса — 10 МБ, больше — 413
    client_max_body_size 10m;

    upstream backend {
        server app:8080;
        keepalive 16;
    }

    # HTTP: healthcheck контейнера и редирект на HTTPS
    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: TLS termination и проксирование на backend
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            limit_req zone=per_ip burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Исходные данные клиента для backend
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
